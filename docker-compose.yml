# StreamGuard observability stack: Prometheus (metrics) + Grafana (dashboards).
#
# This compose file intentionally covers ONLY the monitoring services. Kafka,
# Zookeeper and the Python consumer run on the host (see README), and the
# consumer exposes metrics on host port 8000 which Prometheus scrapes via
# host.docker.internal.

services:
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: streamguard-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      # Mount our scrape config (5s interval, scrapes the host consumer).
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      # Makes "host.docker.internal" resolve to the host on Linux too, so the
      # scrape target in prometheus.yml works across all platforms.
      - "host.docker.internal:host-gateway"
    networks:
      - streamguard-net

  grafana:
    image: grafana/grafana:11.1.0
    container_name: streamguard-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Dev credentials — fine for local use. CHANGE these before exposing
      # Grafana anywhere reachable by others.
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      # Provision the Prometheus datasource and dashboard provider on boot...
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      # ...and the dashboard JSON itself.
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - streamguard-net

  alert_service:
    build:
      context: .
      dockerfile: Dockerfile.alert
    container_name: streamguard-alert
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      # Persist the alerts.csv audit log on the host.
      - ./logs:/app/logs
    # NOTE: the task asked for `depends_on: [kafka]`. This compose file does not
    # run Kafka (it runs on the host per the README), so there is no kafka
    # service to depend on. If you containerise Kafka, add it here and uncomment:
    # depends_on:
    #   - kafka
    networks:
      - streamguard-net

# Shared network so Grafana can reach Prometheus by service name (http://prometheus:9090).
networks:
  streamguard-net:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
